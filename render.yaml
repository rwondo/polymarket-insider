services:
  - type: web
    name: polymarket-insider
    env: python
    buildCommand: "pip install -r requirements.txt"
    # Runs the ingestion worker in the background (&) and the FastAPI server in the foreground
    startCommand: "python main.py & uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: POLYGON_WSS_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"