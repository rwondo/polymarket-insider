services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-polymarket}
      POSTGRES_DB: polymarket_insider
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket -d polymarket_insider"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://polymarket:${DB_PASSWORD:-polymarket}@db:5432/polymarket_insider
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ALL_TRADES_WEBHOOK_URL: ${ALL_TRADES_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
